name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Sync from upstream
        run: |
          git remote add upstream https://github.com/leonvanzyl/autocoder.git || true
          git fetch upstream
          git checkout master
          git merge upstream/master --no-edit -X theirs || echo "Merge conflict - manual intervention needed"
          git push origin master
